<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>keycloak-theme</title>
    <style>
      /* Prevent flash of dark/white background before React renders the background image.
         !important overrides the inline style set by early-color-scheme.js */
      html, body {
        background-color: #c8c4be !important;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
